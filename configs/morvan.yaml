# Pilot zone: two windows inside the Parc naturel régional du Morvan.

name: morvan
crs: EPSG:32631 # UTM zone 31N, native CRS of the Sentinel-2 tiles over the Morvan
resolution: 10 # metres

period:
  reference_year: 2022 # stable year that changes are measured against
  detection_years: [2023, 2024] # calibration year, then test year
  load_until: 2025-06-30 # late-2024 cuts often only show after the winter clouds

sufosat:
  # SUFOSAT v3.0.1, Zenodo record 17253008. Both files share one 10 m Lambert-93 grid.
  dates: # estimated clear-cut date, YYDDD
    url: https://zenodo.org/api/records/17253008/files/forest-clearcuts_mainland-france_sufosat_dates_v3_set25.tif/content
    filename: forest-clearcuts_mainland-france_sufosat_dates_v3_set25.tif
    md5: 7691d5d7ad104f713bf1292282228935
  prob: # probability of the clear-cut, %
    url: https://zenodo.org/api/records/17253008/files/forest-clearcuts_mainland-france_sufosat_prob_v3_set25.tif/content
    filename: forest-clearcuts_mainland-france_sufosat_prob_v3_set25.tif
    md5: a8e99dad237c07c677b69a36f356aac4

pnr:
  id_mnhn: FR8000025 # PNR du Morvan in the PatriNat layer of the IGN Géoplateforme

selection: # `sylvigie suggest-zone`, over the detection years
  window_km: 25
  step_km: 1
  min_cuts_per_year: 100 # clear-cut objects per year inside the window
  min_object_ha: 0.5 # smallest clear-cut counted; matches our minimum mapping unit
  min_pnr_fraction: 0.75
  max_overlap: 0.5 # candidates may share at most half their area
  n_candidates: 3

grid: # `sylvigie grid`
  margin_m: 500 # processed around each window, never evaluated

s2: # `sylvigie ingest`: Sentinel-2 L2A from Microsoft Planetary Computer
  collection: sentinel-2-l2a
  # 10 m: B04 red, B08 NIR. 20 m (resampled to 10 m): B05 red edge, B8A narrow
  # NIR, B11 and B12 shortwave infrared. Enough for NDVI, NBR, NDMI, NDRE, CRSWIR.
  bands: [B04, B05, B08, B8A, B11, B12]
  max_tile_cloud: 80 # loose pre-filter on the whole 110 km tile
  min_clear_fraction: 0.2 # share of the window's forest pixels that must be clear
  scl_valid: [4, 5, 6] # vegetation, bare soil, water
  mask_dilation_px: 2 # grow the cloud mask to catch cloud edges

# Pilot windows chosen from `sylvigie suggest-zone` (2026-11-17), as
# [xmin, ymin, xmax, ymax] in `crs`. They do not overlap (3 km apart).
windows:
  # D1, densest window: thresholds and models are developed and tuned here.
  dev: [569000, 5205000, 594000, 5230000]
  # R1, closest to the whole park: headline metrics are measured here.
  eval: [564000, 5233000, 589000, 5258000]
